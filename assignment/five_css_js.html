<!DOCTYPE html>
<html>
<head>
  <title>Security Check</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background: #f2f2f2;
    }

    .box {
      width: 300px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Security Check</h2>

    <input type="password" id="password" placeholder="Enter Password">
    <br>

    <button onclick="checkPassword()">Check</button>

    <p id="result"></p>
  </div>

  <script>

    function checkPassword() {

      // Correct password
      let correctPassword = "admin123";

      // User entered password
      let password = document.getElementById("password").value;

      let i = 0;
      let match = true;

      // WHILE LOOP
      while (i < correctPassword.length) {

        if (password[i] != correctPassword[i]) {
          match = false;
        }

        i++;
      }

      let attempts = 0;

      // DO WHILE LOOP
      do {

        if (password.length == correctPassword.length && match) {

          document.getElementById("result").innerHTML =
            "✔ Correct Password";

          document.getElementById("result").style.color = "green";

        }

        else {

          document.getElementById("result").innerHTML =
            "✖ Incorrect Password";

          document.getElementById("result").style.color = "red";

        }

        attempts++;

      } while (attempts < 1);

    }

  </script>

</body>
</html>
