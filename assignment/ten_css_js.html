<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keerthana Acharya | Secure Terminal</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --accent-blue: #38bdf8;
            --light-blue: #7dd3fc;
            --glass: rgba(255, 255, 255, 0.08);
            --error: #ff6b6b;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .security-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            width: 320px;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: var(--accent-blue);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 20px var(--accent-blue);
        }

        h1 {
            color: var(--light-blue);
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            color: white;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        button {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: var(--light-blue);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #status-msg {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .error {
            color: var(--error);
        }

        .success {
            color: var(--success);
        }
    </style>
</head>

<body>

    <div class="security-card">

        <div class="icon-box">🔒</div>

        <h1>System Access</h1>

     <p id="attempts-left">
    3 attempts remaining
    </p>

        <input
            type="password"
            id="passInput"
            placeholder="Enter Security Code"
            autofocus
        >

        <button id="verifyBtn">
            Unlock Terminal
        </button>

        <div id="status-msg"></div>

    </div>

    <script>

        const KEY = "Kitty2025";

        let tries = 3;

        const input = document.getElementById("passInput");
        const btn = document.getElementById("verifyBtn");
        const msg = document.getElementById("status-msg");
        const attemptsText =
            document.getElementById("attempts-left");

        btn.addEventListener("click", verifyAccess);

        input.addEventListener("keypress", function (e) {

            if (e.key === "Enter") {
                verifyAccess();
            }

        });

        function verifyAccess() {

            let enteredKey = input.value;

            // DO-WHILE LOOP
            do {

                if (enteredKey === KEY) {

                    msg.className = "success";

                    msg.innerText =
                        "ACCESS GRANTED. Welcome, Keerthana.";

                    input.disabled = true;
                    btn.disabled = true;

                    setTimeout(() => {

                        window.location.href =
                            "https://github.io";

                    }, 1500);

                    break;

                } else {

                    // WHILE LOOP
                    while (tries > 0) {

                        tries--;

                        msg.className = "error";

                        msg.innerText =
                            "INVALID KEY";

                        attemptsText.innerText =
                            `${tries} attempts remaining`;

                        input.value = "";

                        if (tries === 0) {

                            msg.innerText =
                                "SYSTEM LOCKED";

                            input.disabled = true;
                            btn.disabled = true;

                            attemptsText.innerText =
                                "0 attempts remaining";
                        }

                        break;
                    }
                }

            } while (enteredKey !== KEY && tries > 0);
        }

    </script>

</body>

</html>
